<div class="sess-note-view__toolbar">
    <button (click)="saveChanges()" [disabled]="isSaving()" title="Save changes">{{(isSaving())?'...':'💾'}}</button>
    <button (click)="deleteNote()" [disabled]="isDeleting()" title="Delete note">{{(isDeleting())?'...':'❌'}}</button>
</div>
<input class="sess-note-view__title" type="text" [ngModel]="note().title"
    (ngModelChange)="updateTitle($event)" />
<textarea class="sess-note-view__text" [ngModel]="note().text" (ngModelChange)="updateText($event)"></textarea>
